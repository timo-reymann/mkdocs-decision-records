version: "2.1"

orbs:
  python: circleci/python@4.0.0
  codecov: codecov/codecov@6.0.0
  github-utils: trustedshops-public/github-utils@1.3.1
  semantic-release: trustedshops-public/semantic-release@6.1.0

executors:
  node:
    docker:
      - image: cimg/python:3.14-node
  python-linux:
    docker:
      - image: cimg/python:3.14

jobs:
  unit-test:
    executor: python-linux
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
      - run:
          name: Run tests
          command: |
            uv run coverage run -m pytest --junit-xml test-results/junit.xml --capture=no mkdocs_decision_records/
            uv run coverage report
            uv run coverage html
            uv run coverage xml -i
      - store_artifacts:
          path: htmlcov
      - store_test_results:
          path: test-results
      - codecov/upload
  build-gh-pages-demo:
    executor: node
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: poetry
          args: --all-extras
      - run:
          name: Build html documentation
          command: |
            cd demo
            poetry run mkdocs build
      - github-utils/publish_github_pages:
          folder: demo/site
          git_commit_author_email: "no-reply@timo-reymann.de"
          git_commit_author_name: "CircleCI"
  pip-publish:
    executor: python-linux
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
          args: --all-extras
      - run:
          name: Publish package
          command: |
            uv build
            uv publish \
              --username "$TWINE_USERNAME" \
              --password "$TWINE_PASSWORD"
workflows:
  main:
    jobs:
      - unit-test
      - build-gh-pages-demo:
          filters:
            branches:
              only:
                - main
          requires:
            - unit-test
      - pip-publish:
          name: publish-pypi
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - semantic-release/with_existing_config:
          name: semantic-release
          additional_packages: "@google/semantic-release-replace-plugin"
          filters:
            branches:
              only:
                - main
          requires:
            - build-gh-pages-demo
