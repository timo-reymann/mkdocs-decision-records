[project]
name = "mkdocs-decision-records"
version = "2.4.3"
description = "Manage decision records with mkdocs in a customizable and minimal fashion."
authors = [{ name = "Timo Reymann", email = "mail@timo-reymann.de" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: MkDocs",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mkdocs>=1.4.0,<=1.6.1",
    "properdocs>=1.6.7",
    "python-frontmatter>=1.1.0,<2",
]

[project.urls]
Repository = "https://github.com/timo-reymann/mkdocs-decision-records"
"Bug Tracker" = "https://github.com/timo-reymann/mkdocs-decision-records/issues"

[project.entry-points."mkdocs.plugins"]
decision-records = "mkdocs_decision_records.plugin:DecisionRecordsPlugin"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5.48,<10",
    "pytest>=9.0.0,<10",
    "coverage>=7.4.0,<8",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["mkdocs_decision_records"]
module-root = ""
source-include = ["LICENSE", "NOTICE"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
omit = [
    ".*",
    "*/site-packages/*",
    "*/*_test.py",
    "dev/*"
]

[tool.coverage.report]
fail_under = 70
